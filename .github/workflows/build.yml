name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Find project and build
        shell: bash
        run: |
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            SETTINGS_FILE=$(find . -maxdepth 3 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: Could not find settings.gradle"
              echo "Repository contents:"
              find . -maxdepth 3 -type f | sort
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          echo "Building Gradle project in: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: fatigue-beacon-26.2
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
